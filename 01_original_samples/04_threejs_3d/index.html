<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVN 검사 라인 · 3D</title><style>
*{box-sizing:border-box}body{height:100vh;display:flex;flex-direction:column;overflow:hidden;margin:0;background:#09131f;color:#edf5ff;font:14px/1.5 system-ui,-apple-system,sans-serif}header{padding:20px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #284052}h1{margin:0;font-size:22px}small,.muted{color:#9bb1c5}.stats{display:flex;gap:36px;padding:16px 28px;background:#102234}.stat b{display:block;font-size:27px;font-variant-numeric:tabular-nums}.stat span{color:#adc0d1;font-size:12px}.controls{margin-left:auto;display:flex;gap:10px;align-items:center}button,select{font:inherit;color:#edf5ff;background:#1b3b52;border:1px solid #45677f;border-radius:7px;padding:9px 12px;cursor:pointer}#viewport{flex:1;min-height:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}footer{flex-shrink:0;height:44px;padding:10px 28px;display:flex;justify-content:space-between;color:#9bb1c5}.legend{display:flex;gap:18px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}#error{position:absolute;inset:0;display:none;place-items:center;background:#102234;padding:30px}@media(max-width:800px){header{padding:12px}h1{font-size:17px}.stats{padding:12px;gap:15px;flex-wrap:wrap}.stat b{font-size:20px}.controls{margin-left:0}footer{font-size:11px;padding:8px}.legend{gap:8px}}
</style></head><body><header><div><small>가상 생산 현황 / 3D SIMULATION</small><h1 id="title"></h1><small id="meta"></small></div><div id="clock">시뮬 경과 0초</div></header><section class="stats" aria-label="실제 시뮬레이션 집계"><div class="stat"><span>최종 통과</span><b id="passed">0</b></div><div class="stat"><span>최종 불량</span><b id="failed">0</b></div><div class="stat"><span>시간당 통과 · UPH</span><b id="uph">—</b></div><div class="stat"><span>완료 수율</span><b id="yield">—</b></div><div class="stat"><span>라인 내 팔레트</span><b id="wip">0</b></div><div class="controls"><button id="toggle">Ⅱ 일시정지</button><label>배속 <select id="speed"></select></label><button id="fit">전체 보기</button></div></section><main id="viewport"><canvas id="scene" aria-label="검사 스테이션과 이동 팔레트 3D 장면"></canvas><div id="error" role="alert"></div></main><footer><div class="legend" id="legend"></div><span>드래그 회전 · 휠 줌 · 회색 지그: 빈 슬롯 / 파랑: 점유</span></footer><script src="../data/line.js"></script><script src="./vendor/three/three.min.js"></script><script src="./app.js"></script></body></html>
