<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVN 최종 검사 라인 · 탑다운</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#192630;--line:#30434f;--muted:#93a5b1;--mint:#51d1b1;--blue:#69b8ff;--red:#ff7478;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(ellipse at 35% 0,#203440,var(--bg) 68%);color:#edf4f7;min-width:900px}.top{max-width:1500px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:var(--mint)}h1{font-size:24px;margin:5px 0}.muted,.legend{color:var(--muted);font-size:12px}.controls{display:flex;gap:9px;align-items:center}button,select{padding:10px 14px;background:#263944;color:white;border:1px solid #49606c;border-radius:8px;font:inherit;font-weight:700}button{cursor:pointer}.layout{max-width:1500px;margin:auto;display:grid;grid-template-columns:minmax(600px,1fr) 270px;gap:16px}.panel{background:var(--panel);border:1px solid #2b3c47;border-radius:14px;padding:16px;box-shadow:0 12px 30px #0003}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.map{display:block;width:100%;height:auto;border-radius:10px;background:#131e27}.floor{fill:#182832;stroke:#354b57;stroke-width:2}.belt{fill:none;stroke:#3c4d58;stroke-width:28;stroke-linejoin:round;stroke-linecap:round}.belt-dash{fill:none;stroke:#758791;stroke-width:1.5;stroke-dasharray:7 9}.reject-lane{fill:none;stroke:#a8454d;stroke-width:11;stroke-dasharray:9 6}.stage-box{fill:#1d2c36;stroke:#49616e;stroke-width:1.5}.stage-name{fill:#edf4f7;font-weight:700;font-size:13px}.stage-meta,.pc-label,.route-label{fill:#9aadb8;font-size:10px}.slot{fill:#263945;stroke:#526875}.desk{fill:#344b58}.monitor{fill:#54cabe}.pallet{fill:#ffd36c;stroke:#fff0bd}.pallet.fail{fill:#f26368;stroke:#ffc5c7}.serial{fill:#17232b;font-weight:800;font-size:6px}.side{display:flex;flex-direction:column;gap:12px}.metric{margin-top:9px;padding:13px;background:#202f39;border-radius:10px}.metric label{display:block;color:var(--muted);font-size:11px}.metric strong{font-size:25px}.mint{color:var(--mint)}.red{color:var(--red)}.blue{color:var(--blue)}.status{font-size:11px;font-weight:700}.stages{max-height:360px;overflow:auto}.stage-row{padding:9px 0;border-bottom:1px solid #30414c;display:flex;justify-content:space-between;gap:8px;font-size:11px}.foot{margin-top:10px;color:#8296a2;font-size:10px}@media(max-width:1050px){body{padding:14px}.layout{grid-template-columns:minmax(0,1fr) 235px}}
</style>
</head>
<body>
<script src="../data/line.js"></script>
<header class="top"><div><div class="eyebrow">FACTORY OPERATIONS · 2D FLOOR</div><h1 id="lineTitle">AVN 검사라인</h1><div class="muted" id="lineSub"></div></div><div class="controls"><button id="toggleButton" type="button">Ⅱ 일시정지</button><label class="muted" for="speedSelect">배속</label><select id="speedSelect"><option value="1">1×</option><option value="5">5×</option><option value="10">10×</option><option value="20">20×</option></select></div></header>
<main class="layout"><section class="panel"><div class="panelhead"><strong>검사 공정 배치도</strong><span class="legend">🟢 슬롯　🟡 이동 팔레트　🔴 리젝트</span></div><svg id="factoryMap" class="map" viewBox="0 0 1000 650" role="img" aria-label="AVN 검사라인 탑다운 배치도"></svg><div class="foot">가상 검사 흐름 · 팔레트와 검사 결과는 시드 기반 의사난수로 재현됩니다.</div></section><aside class="side"><section class="panel"><div class="panelhead"><strong>라인 KPI</strong><span class="status mint">● 가동</span></div><div class="metric"><label>누적 통과</label><strong id="passCount" class="mint">0</strong> 대</div><div class="metric"><label>누적 불량</label><strong id="failCount" class="red">0</strong> 대</div><div class="metric"><label>시간당 생산량</label><strong id="uphValue" class="blue">0</strong> UPH</div><div class="metric"><label>라인 takt / 목표</label><strong id="taktValue">—</strong></div></section><section class="panel"><div class="panelhead"><strong>스테이션 상태</strong><span id="shiftName" class="legend"></span></div><div id="stageList" class="stages"></div></section></aside></main>
<script src="app.js"></script>
</body>
</html>
<style>
.reject-slot{fill:#59656c;stroke:#a4afb4;stroke-width:1}.reject-slot.occupied{fill:#f26368;stroke:#ffc5c7}.stage-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 8px}.stage-counts{grid-column:1;color:#93a5b1;font-size:10px}.stage-row .status{grid-column:2;grid-row:1 / span 2;align-self:center}
</style>
